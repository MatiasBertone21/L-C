services:
  mongo:
    image: mongo:7.0
    container_name: lc-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Define MONGO_INITDB_ROOT_USERNAME en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Define MONGO_INITDB_ROOT_PASSWORD en .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-lc_inventory}
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lc-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-L&C Stock & POS API}
      APP_VERSION: ${APP_VERSION:-0.5.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-lc_inventory}
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_DB_NAME:-lc_inventory}?authSource=admin}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Define JWT_SECRET_KEY en .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@librerialc.com.ar}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-ventas@librerialc.com.ar}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SUPPLIER_DEFAULT_CODE: ${SUPPLIER_DEFAULT_CODE:-elonce}
      SUPPLIER_IMAGE_ALLOWED_HOSTS: ${SUPPLIER_IMAGE_ALLOWED_HOSTS:-www.eloncemayorista.com.ar,eloncemayorista.com.ar}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Argentina/Buenos_Aires}
      IMPORT_MAX_UPLOAD_MB: ${IMPORT_MAX_UPLOAD_MB:-15}
      IMPORT_MIN_ROWS_RATIO: ${IMPORT_MIN_ROWS_RATIO:-0.5}
      IMPORT_TMP_DIR: /data/import-tmp
      IMPORT_TMP_RETENTION_DAYS: ${IMPORT_TMP_RETENTION_DAYS:-7}
    volumes:
      - ./backend:/app
      - import_tmp:/data/import-tmp
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app_network

volumes:
  mongo_data:
  frontend_node_modules:
  import_tmp:

networks:
  app_network:
    driver: bridge
